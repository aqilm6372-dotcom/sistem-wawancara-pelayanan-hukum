<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistem Wawancara Pelayanan Hukum</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  >

  <style>
    body {
      background-color: #f4f6f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
    }
    .login-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: #0d3b66;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 1rem auto;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-4 col-md-6 col-sm-8">

        <div class="card shadow-sm border-0">
          <div class="card-body p-4">

            <div class="login-icon">
              <i class="bi bi-shield-lock"></i>
            </div>

            <h4 class="text-center fw-bold mb-1">Sistem Wawancara Pelayanan Hukum</h4>
            <p class="text-center text-muted mb-4">Silakan masuk untuk melanjutkan</p>

            {% if error %}
            <div class="alert alert-danger py-2" role="alert">
              {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}">
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input
                  type="text"
                  class="form-control"
                  id="username"
                  name="username"
                  required
                  autofocus
                >
              </div>

              <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  name="password"
                  required
                >
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                  <i class="bi bi-box-arrow-in-right"></i> Masuk
                </button>
              </div>
            </form>

          </div>
        </div>

        <p class="text-center text-muted small mt-3">
          &copy; 2026 Sistem Wawancara Pelayanan Hukum
        </p>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

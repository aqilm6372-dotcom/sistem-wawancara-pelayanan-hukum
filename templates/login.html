<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Pelayanan Hukum Datun Kejaksaan</title>

  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    :root {
      /* Skema Warna Utama Datun Kejaksaan */
      --datun-gold-primary: #f8b500;
      --datun-gold-dark: #b87b00;
      --datun-gold-light: #fff3c4;
      --datun-green-primary: #074720;
      --datun-green-dark: #042e14;
      --bg-gradient: linear-gradient(135deg, #fceabb 0%, #f8b500 50%, #d48a00 100%);
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      position: relative;
      overflow-x: hidden;
    }

    /* ========================================================
       ELEMENTS / ORNAMENS BACKGROUND (DI BELAKANG KARTU/BORDER)
       ======================================================== */
    .bg-ornament-container {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1; /* Di belakang card (z-index card = 10) */
    }

    .ornament-icon {
      position: absolute;
      color: var(--datun-green-primary);
      opacity: 0.12; /* Halus agar tidak mengganggu mata */
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
    }

    /* Posisi Aksen Ornamen Hukum */
    .ornament-1 { top: 5%; left: 3%; font-size: 16rem; transform: rotate(-15deg); } /* Timbangan Kiri Atas */
    .ornament-2 { bottom: 2%; right: 2%; font-size: 20rem; transform: rotate(10deg); } /* Perisai Kanan Bawah */
    .ornament-3 { bottom: 8%; left: 5%; font-size: 14rem; transform: rotate(-8deg); } /* Gedung Kiri Bawah */
    .ornament-4 { top: 8%; right: 6%; font-size: 12rem; transform: rotate(12deg); } /* Buku Hukum Kanan Atas */

    /* KARTU LOGIN UTAMA */
    .login-card {
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(16px);
      border: 3px solid #ffffff;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(184, 123, 0, 0.4);
      overflow: hidden;
      max-width: 420px;
      width: 100%;
      position: relative;
      z-index: 10; /* Berada di atas ornamen background */
    }

    .card-header-datun {
      background: linear-gradient(180deg, var(--datun-green-primary) 0%, var(--datun-green-dark) 100%);
      border-bottom: 4px solid var(--datun-gold-primary);
      padding: 2.2rem 1.5rem 1.8rem 1.5rem;
      text-align: center;
      color: white;
      position: relative;
    }

    .logo-emblem {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid var(--datun-gold-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .badge-kejaksaan {
      background-color: var(--datun-gold-primary);
      color: #000;
      font-weight: 800;
      font-size: 0.75rem;
      padding: 5px 12px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    /* Tombol & Input Style */
    .btn-datun {
      background: linear-gradient(45deg, #f8b500, #ffd24d);
      color: #2b1a00;
      font-weight: 800;
      border: none;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      box-shadow: 0 5px 15px rgba(248, 181, 0, 0.4);
    }

    .btn-datun:hover {
      background: linear-gradient(45deg, #e09b00, #f8b500);
      color: #000;
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(224, 155, 0, 0.5);
    }

    .form-control:focus {
      border-color: var(--datun-gold-primary);
      box-shadow: 0 0 0 0.25rem rgba(248, 181, 0, 0.3);
    }
  </style>
</head>
<body>

  <!-- LAYER ELEMEN & AKSEN HUKUM DI BELAKANG BORDER/KARTU -->
  <div class="bg-ornament-container">
    <i class="bi bi-scale-balanced ornament-icon ornament-1"></i>
    <i class="bi bi-shield-check ornament-icon ornament-2"></i>
    <i class="bi bi-bank ornament-icon ornament-3"></i>
    <i class="bi bi-journal-bookmark-fill ornament-icon ornament-4"></i>
  </div>

  <div class="container py-4 position-relative" style="z-index: 10;">
    <div class="row justify-content-center">
      <div class="col-12 d-flex justify-content-center">

        <!-- CARD LOGIN -->
        <div class="login-card">
          
          <!-- Header Card -->
          <div class="card-header-datun">
            <!-- Emblem Logo Timbangan Resmi -->
            <div class="logo-emblem">
              <i class="bi bi-scale-balanced text-warning display-5"></i>
            </div>

            <span class="badge-kejaksaan mb-2 d-inline-block">
              <i class="bi bi-shield-lock-fill me-1"></i> KEJAKSAAN REPUBLIK INDONESIA
            </span>

            <h4 class="fw-bold mb-0 text-warning" style="letter-spacing: 1.5px;">DATUN KEJAKSAAN</h4>
            <small class="text-white-50">Sistem Pelayanan Hukum Wawancara</small>
          </div>

          <!-- Body Form Login -->
          <div class="card-body p-4">

            {% if error %}
            <div class="alert alert-danger py-2 small d-flex align-items-center rounded-3 mb-3" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
              <div>{{ error }}</div>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}" id="loginForm">
              
              <!-- Input Username -->
              <div class="mb-3">
                <label for="username" class="form-label fw-bold text-dark small">USERNAME</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-person-badge-fill text-warning"></i></span>
                  <input
                    type="text"
                    class="form-control border-start-0 ps-0"
                    id="username"
                    name="username"
                    placeholder="Masukkan username"
                    required
                    autocomplete="off"
                  >
                </div>
              </div>

              <!-- Input Password -->
              <div class="mb-4">
                <label for="password" class="form-label fw-bold text-dark small">PASSWORD</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-lock-fill text-warning"></i></span>
                  <input
                    type="password"
                    class="form-control border-start-0 border-end-0 ps-0"
                    id="password"
                    name="password"
                    placeholder="Masukkan password"
                    required
                  >
                  <button class="btn btn-outline-secondary border-start-0" type="button" id="togglePassword">
                    <i class="bi bi-eye-slash" id="toggleIcon"></i>
                  </button>
                </div>
              </div>

              <!-- Tombol Submit -->
              <div class="d-grid mb-2">
                <button type="submit" class="btn btn-datun btn-lg py-2">
                  <i class="bi bi-box-arrow-in-right me-1"></i> MASUK SISTEM
                </button>
              </div>

            </form>

          </div>
          
          <div class="card-footer text-center bg-light py-2 border-0">
            <small class="text-muted fw-semibold">&copy; 2026 Kejaksaan Republik Indonesia</small>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePassword');
    const toggleIcon = document.getElementById('toggleIcon');

    // Toggle Intip Password
    togglePasswordBtn.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.replace('bi-eye-slash', 'bi-eye');
      } else {
        passwordInput.type = 'password';
        toggleIcon.classList.replace('bi-eye', 'bi-eye-slash');
      }
    });
  </script>
</body>
</html>
